<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cut the Cake | Heart to Heart</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Great+Vibes&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script>
    if (sessionStorage.getItem("pageTransition") === "1") {
      document.documentElement.classList.add("is-arriving");
    }
  </script>
</head>
<body class="celebrate-body">
  <div class="page-veil" id="page-veil" aria-hidden="true"></div>
  <canvas id="fireworks" class="fireworks-canvas" aria-hidden="true"></canvas>
  <div class="balloon-sky" id="balloon-sky" aria-hidden="true"></div>

  <main class="celebrate-stage" id="celebrate-stage">
    <p class="celebrate-kicker">One last surprise</p>
    <h1 class="celebrate-title">Make a wish, then cut the cake</h1>
    <p class="celebrate-hint" id="celebrate-hint">Tap the cake to cut it</p>

    <button class="cake-button" id="cake-button" type="button" aria-label="Cut the birthday cake">
      <span class="knife" aria-hidden="true">
        <span class="knife-handle"></span>
        <span class="knife-blade"></span>
      </span>
      <span class="cake-split">
        <span class="cake-half is-left" id="cake-left"></span>
        <span class="cake-half is-right" id="cake-right"></span>
      </span>
    </button>
  </main>

  <div class="anniversary-overlay" id="anniversary-overlay" aria-live="polite">
    <span class="birthday-kicker">And now, for us</span>
    <h2>Happy Anniversary</h2>
    <p>To the love we keep choosing, and to every year still waiting to be photographed.</p>
    <a href="memories.html">Look at our memories again</a>
  </div>

  <script src="celebrate.js"></script>
</body>
</html>
